name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate. Everything else is informational: this job is what makes a red
  # merge impossible, and it runs in about a minute.
  verify:
    name: lint · typecheck · unit · assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Art is reproducible
        # `src/sprites/cats/nunu.ts` is generated but committed, so a generator
        # change that was not followed by a regeneration would show up here as a
        # dirty tree rather than as a mystery art diff in a later PR.
        run: |
          npm run cat
          git diff --exit-code -- src/sprites/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Asset provenance audit
        run: npm run assets:audit

  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # M1 ships without native dependencies, so this needs no rebuild step and no
      # electron-builder install-app-deps. When `uiohook-napi` becomes required
      # rather than optional, `npm run rebuild` has to land here.
      - name: Build
        run: npm run build

      - name: Icons
        run: npm run icons

  # Golden-image and integration coverage is not written yet (PLAN.md 9.1, 9.3).
  # This job is a placeholder that runs the pieces that do exist under a real
  # display, so the slot exists rather than being invented later under pressure.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: xvfb-run --auto-servernum npm test
